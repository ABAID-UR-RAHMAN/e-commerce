<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | EcoShop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="login">
  <header class="site-header">
    <div class="container navbar">
      <a class="brand" href="index.html"><span>🛍️</span>EcoShop</a>
      <nav class="nav-links">
        <a class="nav-button" href="index.html">Home</a>
        <a class="nav-button" href="marketplace.html">Marketplace</a>
        <a class="nav-button" href="signup.html">Create Account</a>
      </nav>
    </div>
  </header>

  <main class="page-shell container">
    <div style="max-width: 480px; margin: 2rem auto;">
      <div class="section-panel" style="background: #ffffff; padding: 2.5rem; border-radius: 20px; box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
          <div style="font-size: 3rem; margin-bottom: 0.5rem;">🔑</div>
          <h2 style="margin: 0; font-size: 1.8rem; color: var(--text);">Welcome Back</h2>
          <p style="color: var(--muted); margin-top: 0.5rem; font-size: 0.95rem;">Sign in to your EcoShop buyer or seller workspace.</p>
        </div>

        <form id="login-form" class="form-grid">
          <div>
            <label style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; display: block;">Email Address</label>
            <input id="loginEmail" name="loginEmail" type="email" placeholder="you@example.com" required />
          </div>
          <div>
            <label style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; display: block;">Password</label>
            <input id="loginPassword" name="loginPassword" type="password" placeholder="••••••••" required />
          </div>
          <button class="primary-button" type="submit" style="width: 100%; padding: 0.9rem; font-size: 1rem; margin-top: 0.5rem;">Sign In to EcoShop</button>
          <div id="login-feedback" style="margin-top: 1rem;"></div>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.92rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 1.25rem;">
          Don't have an account? <a href="signup.html" style="color: var(--accent); font-weight: 700;">Create one now</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 EcoShop. Enterprise multi-vendor authentication.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
